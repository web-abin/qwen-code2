<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>3D骰子 | 参考图布局版</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f5f5f7;
}

/* 骰子外层容器 flex */
.dice-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

/* 默认骰子图标：上下浮动 */
.dice-icon {
  font-size: 60px;
  animation: float 1.8s ease-in-out infinite;
  cursor: pointer;
  user-select: none;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-8px); }
}

/* 3D骰子容器 */
.dice-3d {
  width: 70px;
  height: 70px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.4s cubic-bezier(0.2,0.8,0.2,1);
  display: none;
}

/* 摇晃旋转动画 */
.dice-shake {
  animation: diceRoll 0.8s linear infinite;
}
@keyframes diceRoll {
  0%   { transform: rotateX(0deg)   rotateY(0deg); }
  100% { transform: rotateX(360deg) rotateY(720deg); }
}

/* 骰子六个面 质感+阴影 */
.face {
  position: absolute;
  width: 70px;
  height: 70px;
  background: #ffffff;
  border-radius: 12px;
  padding: 10px;
  box-shadow: 
    inset 0 0 8px rgba(0,0,0,0.06),
    0 2px 8px rgba(0,0,0,0.12);
  display: grid;
}
.front  { transform: translateZ(35px); }
.back   { transform: rotateY(180deg) translateZ(35px); }
.left   { transform: rotateY(-90deg) translateZ(35px); }
.right  { transform: rotateY(90deg)  translateZ(35px); }
.top    { transform: rotateX(90deg)  translateZ(35px); }
.bottom { transform: rotateX(-90deg) translateZ(35px); }

/* 点数布局 - 完全对齐参考图 */
.dot {
  width: 14px;
  height: 14px;
  background: radial-gradient(circle at 30% 30%, #333, #000);
  border-radius: 50%;
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.3);
  place-self: center;
}

/* 1点 */
.f1 { grid-template-columns: 1fr; }

/* 2点：对角分布（左下+右上） */
.f2 { 
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}
.f2 .dot:nth-child(1) { grid-area: 2 / 1 / 3 / 2; }
.f2 .dot:nth-child(2) { grid-area: 1 / 2 / 2 / 3; }

/* 3点：左下+中+右上 */
.f3 { 
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
}
.f3 .dot:nth-child(1) { grid-area: 3 / 1 / 4 / 2; }
.f3 .dot:nth-child(2) { grid-area: 2 / 2 / 3 / 3; }
.f3 .dot:nth-child(3) { grid-area: 1 / 3 / 2 / 4; }

/* 4点：四角分布 */
.f4 { 
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

/* 5点：四角+中心 */
.f5 { 
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}
.f5 .dot-center { grid-area: 2 / 1 / 3 / 3; }

/* 6点：两列三行 */
.f6 { 
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
}

/* 底部投影 */
.dice-shadow {
  position: absolute;
  bottom: -18px;
  left: 50%;
  transform: translateX(-50%);
  width: 55px;
  height: 12px;
  background: radial-gradient(ellipse, rgba(0,0,0,0.18) 0%, transparent 70%);
  border-radius: 50%;
  display: none;
}
</style>
</head>
<body>

<div class="dice-wrap">
  <!-- 默认显示：浮动骰子图标 -->
  <div class="dice-icon" id="diceIcon">🎲</div>

  <!-- 3D真实骰子（默认隐藏） -->
  <div class="dice-3d" id="dice3d">
    <div class="face front f1"><div class="dot"></div></div>
    <div class="face back f2"><div class="dot"></div><div class="dot"></div></div>
    <div class="face left f3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="face right f4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="face top f5">
      <div class="dot"></div><div class="dot"></div>
      <div class="dot dot-center"></div>
      <div class="dot"></div><div class="dot"></div>
    </div>
    <div class="face bottom f6">
      <div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div>
    </div>
  </div>
  <div class="dice-shadow" id="diceShadow"></div>
</div>

<script>
// 骰子摇晃总时长（毫秒）—— 调节此常量即可改变掷骰子动画的快慢
const ROLL_DURATION = 1200;

const diceIcon  = document.getElementById('diceIcon');
const dice3d     = document.getElementById('dice3d');
const diceShadow = document.getElementById('diceShadow');
let rolling = false;

// 定格角度：只显示正面，不露侧面
const angleList = [
  {x:0,    y:0},     // 1
  {x:0,    y:180},   // 2
  {x:0,    y:-90},   // 3
  {x:0,    y:90},    // 4
  {x:-90,  y:0},     // 5
  {x:90,   y:0}      // 6
];

// 重置骰子（任务完成/胜出 调用这个）
function resetDice(){
  rolling = false;
  dice3d.classList.remove('dice-shake');
  dice3d.style.transform = '';
  // 切回图标
  diceIcon.style.display = 'block';
  dice3d.style.display = 'none';
  diceShadow.style.display = 'none';
}

// 点击开始掷骰子
diceIcon.addEventListener('click', ()=>{
  if(rolling) return;
  rolling = true;

  // 隐藏图标，显示3D骰子+阴影
  diceIcon.style.display = 'none';
  dice3d.style.display = 'block';
  diceShadow.style.display = 'block';

  // 开启摇晃
  dice3d.classList.add('dice-shake');

  // 随机点数
  let randomIdx = Math.floor(Math.random() * 6);

  setTimeout(()=>{
    dice3d.classList.remove('dice-shake');
    let a = angleList[randomIdx];
    dice3d.style.transform = `rotateX(${a.x}deg) rotateY(${a.y}deg)`;
    rolling = false;
  }, ROLL_DURATION);
});

// 暴露全局，给你的飞行棋弹窗关闭后调用
window.resetDice = resetDice;
</script>

</body>
</html>
